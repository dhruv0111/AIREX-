# ============================================================
# AIREX — Local E2E override (NOT used by CI).
# Remaps host ports because this workstation also runs the
# unrelated "multi-agentplatform" stack on 8000/5432/6379/9090/3000.
# `!override` REPLACES the base compose `ports` list (merge would
# concatenate, re-binding the conflicting ports).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#   E2E_BASE_URL=http://localhost:3100 E2E_API_URL=http://localhost:8010 npx playwright test
# ============================================================
services:
  postgres:
    ports: !override
      - "5434:5432"

  redis:
    ports: !override
      - "6381:6379"

  api:
    ports: !override
      - "8010:8000"
    environment:
      # Browser origin is http://localhost:3100 in this override.
      API_CORS_ORIGINS: "http://localhost:3000,http://localhost:3100"

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8010
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010
    ports: !override
      - "3100:3000"

  prometheus:
    ports: !override
      - "9091:9090"

  grafana:
    ports: !override
      - "3002:3001"
