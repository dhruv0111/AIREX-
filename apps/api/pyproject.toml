[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airex-api"
version = "0.1.0"
description = "AIREX — AI Reliability, Evaluation & Observability Platform (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "PyJWT>=2.9.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: Depends()/Header() in argument defaults is the idiomatic FastAPI pattern.
# B904: custom exceptions raised inside except clauses without `from` are fine here.
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# conftest intentionally sets environment variables before importing app modules.
"tests/conftest.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "app/main.py"]

[tool.coverage.report]
fail_under = 60
