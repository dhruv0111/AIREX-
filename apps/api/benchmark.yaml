benchmark:
  name: "CLI Benchmark Suite"
  description: "Benchmarking from CLI tool"
  dataset: "production-dataset"
  baseline:
    model: "gpt-4o"
  candidates:
    - model: "claude-3-5"
  weights:
    accuracy: 0.4
    latency_ms: 0.2
    estimated_cost: 0.1
    consistency: 0.1
    safety: 0.2
  evaluators:
    - type: "exact_match"
      enabled: true
