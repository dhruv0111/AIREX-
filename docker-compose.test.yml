# ============================================================
# AIREX — Test stack (Phase 0)
# Ephemeral Postgres + Redis used by integration/worker tests.
# ============================================================
name: airex-test

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airex-test-postgres
    environment:
      POSTGRES_USER: airex
      POSTGRES_PASSWORD: airex
      POSTGRES_DB: airex_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airex -d airex_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - airex-test-network

  redis:
    image: redis:7-alpine
    container_name: airex-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - airex-test-network

networks:
  airex-test-network:
    driver: bridge
