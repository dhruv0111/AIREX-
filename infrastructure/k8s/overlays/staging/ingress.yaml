apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airex-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - staging.app.airex.io
        - staging.api.airex.io
      secretName: airex-staging-tls-cert
  rules:
    - host: staging.app.airex.io
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: airex-api-service
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: airex-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airex-web-service
                port:
                  number: 3000
    - host: staging.api.airex.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airex-api-service
                port:
                  number: 8000
