apiVersion: v1
kind: Secret
metadata:
  name: airex-secrets
  
  labels:
    app.kubernetes.io/name: airex
    app.kubernetes.io/component: secrets
  annotations:
    description: "Template secret for production deployment. In live cloud clusters, populated via ExternalSecrets Operator from AWS Secrets Manager or HashiCorp Vault."
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://airex_user:REPLACE_WITH_MANAGED_VAULT_DB_PASSWORD@postgres.internal.airex.io:5432/airex_prod?sslmode=require"
  REDIS_URL: "rediss://:REPLACE_WITH_VAULT_REDIS_AUTH@redis.internal.airex.io:6379/0"
  JWT_SECRET_KEY: "REPLACE_WITH_MINIMUM_32_CHAR_CRYPTOGRAPHIC_JWT_SECRET_KEY"
  CREDENTIAL_ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_URLSAFE_BASE64_FERNET_KEY="
