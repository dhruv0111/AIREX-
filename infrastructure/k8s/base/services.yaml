apiVersion: v1
kind: Service
metadata:
  name: airex-api-service
  
  labels:
    app.kubernetes.io/name: airex
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: airex
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: airex-web-service
  
  labels:
    app.kubernetes.io/name: airex
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: airex
    app.kubernetes.io/component: web
